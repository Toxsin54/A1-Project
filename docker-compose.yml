# Yerel geliştirme / küçük kurulum: PostgreSQL + n8n
#   cp .env.example .env   # değerleri doldurun
#   docker compose up -d
# n8n: http://localhost:5678
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-a1}
      POSTGRES_USER: ${POSTGRES_USER:-a1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      TZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
      # İlk açılışta şema, fonksiyonlar ve örnek veriler yüklenir (dosya adı sırasıyla)
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY gerekli}
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
